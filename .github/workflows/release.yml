name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build & Package Windows Release (x64)
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Run Verification Gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace -- --test-threads=1

      - name: Package Release Assets
        shell: pwsh
        run: |
          $ver = "$($env:GITHUB_REF_NAME)".TrimStart('v')
          & .\scripts\package-release.ps1 -Version $ver -OutputDir "dist"
          Get-FileHash -Path dist\* -Algorithm SHA256 | Out-File -Encoding utf8 dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
